; Development configuration for the library itself (tests and static analysis).
; Projects using the library do not need this file; see examples/basic.

[platformio]
default_envs = native

; Host-side unit tests for the hardware-independent parts: `pio test -e native`
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=gnu++11
    -D UNITY_INCLUDE_DOUBLE
    -Wall
    -Wextra
    -I src

; cppcheck over the library sources: `pio check -e check --fail-on-defect=low`
; (clang-tidy runs via scripts/run_clang_tidy.py, which gives it the real compile commands)
[env:check]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
lib_deps =
    esp32async/ESPAsyncWebServer@^3.7.0
    esp32async/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^7.2.0
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
    +<src/>
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr --suppress=unusedFunction --suppress=missingIncludeSystem --suppress=useStlAlgorithm --suppress=*:*/.pio/libdeps/*
