name: CI

on:
  push:
    branches: [master, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and lint (pre-commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Unit tests (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -e native

  build:
    name: Build example (${{ matrix.env }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [esp32dev, esp32dev_core3, esp32s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('examples/basic/platformio.ini', 'library.json') }}
      - run: pip install platformio
      - run: pio run -d examples/basic -e ${{ matrix.env }}

  analysis:
    name: Static analysis (cppcheck, clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-analysis-${{ hashFiles('platformio.ini', 'examples/basic/platformio.ini', 'library.json') }}
      - run: pip install platformio
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - run: pio check -e check --fail-on-defect=low
      - run: python3 scripts/run_clang_tidy.py
