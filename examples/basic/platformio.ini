; ==============================================================================
;  ProjectUtils-esp32 - basic example
; ==============================================================================
;  Build and flash one environment:
;      pio run -e <name> -t upload -t monitor
;
;  Environments:
;      esp32dev         classic ESP32,  Arduino core 2.x
;      esp32dev_core3   classic ESP32,  Arduino core 3.x
;      esp32s3          ESP32-S3 (8 MB flash, native USB),  Arduino core 2.x
; ==============================================================================


; ------------------------------------------------------------------------------
;  Shared by all environments
; ------------------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200

; The library is taken from this repository. In your own project use:
;     lib_deps = https://github.com/Cameloah/ProjectUtils-esp32.git#v2.2.0
lib_deps = symlink://../..


; ------------------------------------------------------------------------------
;  Classic ESP32, Arduino core 2.x
; ------------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev

; Larger app partition. TLS, web server and web console together do not fit
; comfortably into the default 1.2 MB slot.
board_build.partitions = min_spiffs.csv


; ------------------------------------------------------------------------------
;  Classic ESP32, Arduino core 3.x (pioarduino platform)
; ------------------------------------------------------------------------------
[env:esp32dev_core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev

; Larger app partition, same reason as above.
board_build.partitions = min_spiffs.csv


; ------------------------------------------------------------------------------
;  ESP32-S3 with 8 MB flash, no PSRAM (chip marking: ESP32-S3FN8)
;  For boards whose USB-C port is wired straight to the chip.
; ------------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1

; 8 MB layout with two 3.3 MB app slots, so OTA updates fit comfortably.
board_build.partitions = default_8MB.csv

; Route Serial to the chip's built-in USB port. Without this flag, Serial goes
; to the UART pins and the monitor stays empty.
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
