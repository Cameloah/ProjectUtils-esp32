[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Larger app partition: TLS, web server and web console do not leave much room in the default.
board_build.partitions = min_spiffs.csv
; In your own project use the repository URL instead:
;   lib_deps = https://github.com/Cameloah/ProjectUtils-esp32.git#v2.0.0
lib_deps = symlink://../..

; Same example on Arduino core 3.x (pioarduino platform)
[env:esp32dev_core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
; Larger app partition: TLS, web server and web console do not leave much room in the default.
board_build.partitions = min_spiffs.csv
lib_deps = symlink://../..
