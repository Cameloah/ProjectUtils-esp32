repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c, c++]
        exclude: \.gen\.h$
  - repo: local
    hooks:
      - id: embed-web-assets
        name: regenerate embedded web assets
        entry: python3 scripts/embed_web_assets.py
        language: system
        files: ^(web/|scripts/embed_web_assets\.py|src/pu/web_assets\.gen\.h)
        pass_filenames: false
